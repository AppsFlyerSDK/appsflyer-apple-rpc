name: "Prepare Release"

on:
  push:
    branches: ['releases/**']

jobs:
  prepare:
    # Only run when a releases/* branch is pushed
    if: startsWith(github.ref, 'refs/heads/releases/')
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Extract version from branch name
        id: extract_version
        run: |
          set -e

          # Extract version from branch name (e.g., releases/1.x.x/1.0.x/1.0.0_rc1 -> 1.0.0)
          BRANCH_PATH=$(echo "${{ github.ref }}" | sed 's|refs/heads/releases/||')

          # Get the last part of the path and extract just the version number
          LAST_PART=$(echo "$BRANCH_PATH" | sed 's|.*/||')
          VERSION=$(echo "$LAST_PART" | sed 's|_[a-zA-Z0-9]*$||')

          # Validate version format (X.Y.Z)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid version format: $VERSION" >&2
            echo "Expected format: X.Y.Z (e.g., 1.0.0)" >&2
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Branch path: $BRANCH_PATH"
          echo "Version extracted: $VERSION"

      - name: Validate XCFrameworks present
        run: |
          set -e

          # Verify all three XCFrameworks exist
          if [ ! -d AppsFlyerRPC.xcframework ] || [ ! -d Dynamic/AppsFlyerRPC.xcframework ] || [ ! -d Strict/AppsFlyerRPC.xcframework ]; then
            echo "ERROR: Missing XCFrameworks" >&2
            echo "  - AppsFlyerRPC.xcframework: $([ -d AppsFlyerRPC.xcframework ] && echo '✅' || echo '❌')" >&2
            echo "  - Dynamic/AppsFlyerRPC.xcframework: $([ -d Dynamic/AppsFlyerRPC.xcframework ] && echo '✅' || echo '❌')" >&2
            echo "  - Strict/AppsFlyerRPC.xcframework: $([ -d Strict/AppsFlyerRPC.xcframework ] && echo '✅' || echo '❌')" >&2
            exit 1
          fi

          echo "✅ XCFrameworks validated"

      - name: Update all version files
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          set -e

          echo "Updating version files to $VERSION..."

          # Update all files
          ./scripts/update_carthage.sh "$VERSION"
          ./scripts/update_podspec.sh "$VERSION"
          ./scripts/update_spm.sh "$VERSION"
          ./scripts/update_readme.sh "$VERSION"

          echo "✅ All files updated"

      - name: Read native SDK version pin
        id: native_pin
        run: |
          set -e

          # RPC's own version (above) is independent of this pin — surfaced here
          # only as a reminder to confirm it still matches the intended native release.
          # This must never abort the release job — it's an informational callout, not a gate —
          # and the capture group accepts any pin format (exact version, range, etc.), not just X.Y.Z,
          # so a non-standard pin still surfaces cleanly instead of dumping the raw podspec line.
          MAIN_PIN=$(grep -m1 "dependency 'AppsFlyerFramework'," AppsFlyerRPC.podspec | sed -E "s/.*'AppsFlyerFramework', '([^']*)'.*/\1/") || true
          STRICT_PIN=$(grep -m1 "dependency 'AppsFlyerFramework/Strict'," AppsFlyerRPC.podspec | sed -E "s/.*'AppsFlyerFramework\/Strict', '([^']*)'.*/\1/") || true

          MAIN_PIN="${MAIN_PIN:-(not found — check AppsFlyerRPC.podspec manually)}"
          STRICT_PIN="${STRICT_PIN:-(not found — check AppsFlyerRPC.podspec manually)}"

          echo "main_pin=$MAIN_PIN" >> $GITHUB_OUTPUT
          echo "strict_pin=$STRICT_PIN" >> $GITHUB_OUTPUT
          echo "Native SDK pin (Main): $MAIN_PIN"
          echo "Native SDK pin (Strict): $STRICT_PIN"

      - name: Create tag
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Create tag with clean version number only
          git tag "$VERSION" -m "Release $VERSION"

          echo "✅ Tag $VERSION created"

      - name: Commit changes to releases branch
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
          BRANCH_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Configure git
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Add all changes
          git add .

          # Commit changes
          git commit -m "chore: bump version to $VERSION"

          # Push changes and tag back to the releases branch
          git push origin "$BRANCH_NAME" --tags

          echo "✅ Changes committed to $BRANCH_NAME with tag"

      - name: Create PR to main
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
          BRANCH_NAME: ${{ github.ref_name }}
          MAIN_PIN: ${{ steps.native_pin.outputs.main_pin }}
          STRICT_PIN: ${{ steps.native_pin.outputs.strict_pin }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Target main branch
          TARGET_BRANCH="main"

          # Create PR title and body
          PR_TITLE="chore: release $VERSION"
          PR_BODY="Release version $VERSION

          ⚠️ **Check native SDK version before merging** — RPC's version is independent of the native SDK's. This release currently depends on:
          - \`AppsFlyerFramework\` @ ${MAIN_PIN} (Main)
          - \`AppsFlyerFramework/Strict\` @ ${STRICT_PIN} (Strict)

          Confirm this is the native SDK version you intend to ship against."

          # Create PR
          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "$PR_TITLE" \
            --body "$PR_BODY"

          echo "✅ PR created from $BRANCH_NAME to $TARGET_BRANCH"

      - name: Summary
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
          BRANCH_NAME: ${{ github.ref_name }}
          MAIN_PIN: ${{ steps.native_pin.outputs.main_pin }}
          STRICT_PIN: ${{ steps.native_pin.outputs.strict_pin }}
        run: |
          echo "## Release Preparation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: $BRANCH_NAME" >> $GITHUB_STEP_SUMMARY
          echo "**Target**: main" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Check native SDK version before merging** — RPC's version is independent of the native SDK's." >> $GITHUB_STEP_SUMMARY
          echo "- \`AppsFlyerFramework\` @ ${MAIN_PIN} (Main)" >> $GITHUB_STEP_SUMMARY
          echo "- \`AppsFlyerFramework/Strict\` @ ${STRICT_PIN} (Strict)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Ready for manual approval and merge" >> $GITHUB_STEP_SUMMARY
